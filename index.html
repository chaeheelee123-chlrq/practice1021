<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk English — 자유 영어 대화</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='22' width='100' height='100' fill='%23c0562f'/><text x='50' y='68' text-anchor='middle' font-size='58' font-family='Georgia' fill='white'>M</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,560&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #efe6d9;
      --ink: #241c16;
      --muted: #746656;
      --line: #e4d5c4;
      --paper: rgba(255, 251, 245, 0.94);
      --bot: #fffdf9;
      --user: #2b241f;
      --user-ink: #f6efe6;
      --accent: #c0562f;
      --accent-deep: #8d3c1d;
      --good: #e7f1e4;
      --good-ink: #234628;
      --shadow: 0 24px 60px rgba(70, 42, 20, 0.1);
      --sans: "Outfit", "Segoe UI", sans-serif;
      --serif: "Fraunces", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(900px 420px at -10% -10%, #f6d7c4, transparent 55%),
        radial-gradient(700px 380px at 110% 0%, #d5e6dc, transparent 50%),
        var(--bg);
    }
    ::selection { background: #f0c7b4; }
    button, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #app {
      height: calc(100dvh - 28px);
      margin: 14px;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto auto;
      grid-template-areas:
        "side log"
        "side suggest"
        "side compose";
      background: var(--paper);
      border: 1px solid rgba(90, 58, 32, 0.08);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    aside {
      grid-area: side;
      border-right: 1px solid var(--line);
      padding: 22px 18px 16px;
      background: rgba(255, 248, 240, 0.7);
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
    .brand h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.7rem;
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .brand em { font-style: italic; color: var(--accent); }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: white;
      font-family: var(--serif);
      flex: none;
    }
    .avatar.lg { width: 46px; height: 46px; border-radius: 16px; font-size: 1.35rem; }

    .blurb, .edit-note { margin: 0; color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
    .edit-note { margin-top: auto; padding-top: 12px; }

    .label {
      margin: 12px 0 0;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topic-list { display: flex; flex-direction: column; gap: 6px; }
    .topic, .seg button, .chip, #reset, .switch {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.45);
    }
    .topic {
      text-align: left;
      border-radius: 12px;
      padding: 8px 10px;
    }
    .topic small { display: block; color: var(--muted); font-size: 0.75rem; }
    .topic.active {
      background: var(--ink);
      color: var(--user-ink);
      border-color: var(--ink);
    }
    .topic.active small { color: #d9c7b6; }

    .seg { display: flex; gap: 6px; }
    .seg button {
      flex: 1;
      border-radius: 999px;
      padding: 7px 10px;
    }
    .seg button.active { background: var(--accent); color: white; border-color: var(--accent); }

    .switch {
      display: flex;
      gap: 8px;
      align-items: center;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 0.92rem;
    }
    #stats { margin: 8px 2px 0; font-size: 0.86rem; color: var(--muted); }
    #reset {
      border-radius: 12px;
      padding: 9px 10px;
      background: transparent;
    }
    #reset:hover, .topic:hover, .chip:hover { border-color: #c9ad93; }

    #log {
      grid-area: log;
      overflow: auto;
      padding: 22px 22px 8px;
      scroll-behavior: smooth;
    }
    #log.hide-hints .hint { display: none; }
    #log:not(.beginner) .simple { display: none; }

    .row { display: flex; gap: 10px; margin-bottom: 14px; }
    .row.user { justify-content: flex-end; }
    .stack { max-width: min(78%, 560px); }
    .bubble {
      position: relative;
      padding: 12px 14px;
      line-height: 1.5;
      border-radius: 18px 18px 18px 6px;
      background: var(--bot);
      border: 1px solid var(--line);
    }
    .bubble p { margin: 0; white-space: pre-wrap; word-break: break-word; }
    .row.user .bubble {
      background: var(--user);
      color: var(--user-ink);
      border-color: var(--user);
      border-radius: 18px 18px 6px 18px;
    }
    .bot .bubble { padding-right: 42px; }
    .pending .bubble { color: var(--muted); font-style: italic; padding-right: 14px; }
    .simple, .hint { margin-top: 6px !important; font-size: 0.86rem; color: var(--muted); }
    .simple::before { content: "쉽게  "; font-weight: 600; color: var(--accent-deep); }
    .hint::before { content: "힌트  "; font-weight: 600; color: #3d6a62; }

    .speak {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: #f3e7dc;
      color: var(--accent-deep);
    }

    .fix {
      margin-top: 6px;
      background: var(--good);
      color: var(--good-ink);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .fix .fix-title { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; }
    .fix .better { margin: 3px 0 0; font-weight: 600; }
    .fix .tip { margin: 3px 0 0; }

    .suggest {
      grid-area: suggest;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 18px 8px;
    }
    .suggest:empty { display: none; }
    .chip {
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 0.86rem;
      background: white;
    }

    #composer { grid-area: compose; }
    .status { margin: 0 20px 6px; color: var(--accent-deep); font-size: 0.84rem; }
    .status:empty { display: none; }
    .compose-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      margin: 0 14px 14px;
      padding: 8px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    textarea {
      flex: 1;
      border: 0;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      padding: 10px 4px;
      line-height: 1.45;
      background: transparent;
    }
    #mic, #send {
      height: 44px;
      border: 0;
      border-radius: 12px;
      flex: none;
    }
    #mic {
      width: 44px;
      background: #f6eee6;
      color: var(--accent-deep);
    }
    #mic.on { background: var(--accent); color: white; }
    #send {
      padding: 0 16px;
      background: var(--accent);
      color: white;
      font-weight: 600;
    }
    #send:disabled { opacity: 0.45; cursor: default; }

    @media (max-width: 760px) {
      body { background: var(--bg); }
      #app {
        height: 100dvh;
        margin: 0;
        border-radius: 0;
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        grid-template-areas:
          "side"
          "log"
          "suggest"
          "compose";
      }
      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px 8px;
        gap: 8px;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
      }
      .blurb, .edit-note, .label { display: none; }
      .brand { width: 100%; margin: 0; }
      .avatar.lg { width: 36px; height: 36px; border-radius: 12px; font-size: 1.1rem; }
      .topic-list { width: 100%; flex-direction: row; overflow-x: auto; }
      .topic { white-space: nowrap; flex: none; }
      .topic small { display: none; }
      .brand h1 { font-size: 1.25rem; }
      .seg { flex: 1 1 160px; }
      .switch { flex: 1 1 140px; padding: 6px 8px; }
      #stats { margin: 0; }
      #reset { width: auto; padding: 7px 10px; }
      #log { padding: 14px 12px 6px; }
      .stack { max-width: 88%; }
      .suggest { padding: 0 12px 8px; }
      .compose-row { margin: 0 10px 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #log { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <div class="brand">
        <div class="avatar lg" aria-hidden="true">M</div>
        <div>
          <h1>Talk <em>English</em></h1>
          <p>미나와 자유롭게</p>
        </div>
      </div>
      <p class="blurb">짧게 적어도 괜찮아요. 어색한 문장은 말풍선 아래에 더 자연스러운 표현이 나와요. 대화는 이 컴퓨터의 서버가 OpenRouter에 대신 요청합니다.</p>
      <p class="label">주제</p>
      <div id="topicList" class="topic-list"></div>
      <p class="label">난이도</p>
      <div class="seg" role="group" aria-label="난이도">
        <button type="button" data-level="beginner">초급</button>
        <button type="button" data-level="intermediate">중급</button>
      </div>
      <label class="switch"><input type="checkbox" id="hints"> 한국어 힌트</label>
      <label class="switch"><input type="checkbox" id="voice"> 음성으로 듣기</label>
      <p id="stats"></p>
      <button type="button" id="reset">대화 다시 시작</button>
      <p class="edit-note">키는 .env의 OPENROUTER_API_KEY에만 두세요. 페이지 소스나 주소창에는 들어가지 않습니다.</p>
    </aside>

    <main id="log" role="log" aria-live="polite"></main>
    <div id="suggest" class="suggest"></div>
    <form id="composer">
      <p id="status" class="status" role="status"></p>
      <div class="compose-row">
        <button type="button" id="mic" aria-label="마이크로 영어로 말하기" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.8"/>
            <path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <textarea id="input" rows="1" lang="en" spellcheck="true" placeholder="영어로 말해 보세요. Enter로 보내기" autocomplete="off"></textarea>
        <button type="submit" id="send" disabled>보내기</button>
      </div>
    </form>
  </div>

  <script>
    const KEY = "talk-english-mina-v1";

    const state = {
      level: "beginner",
      topic: "free",
      hints: true,
      voice: false,
      name: "",
      from: "",
      likes: [],
      turns: 0,
      words: 0,
      quiz: false,
      quizAt: 0,
      slow: false,
      used: {},
      expect: "free",
      lastEn: "",
      lastSimple: "",
      lastSuggestions: [],
      lastSubject: "",
      history: [],
      busy: false,
      api: false,
      provider: ""
    };

    const NOT_NAMES = new Set("fine good tired happy sad ok okay here from sorry hungry bored busy great student sleepy excited nervous a an the not very so just well bad nice hello hi hey yes no sure friend people someone going doing trying really pretty home school work today yesterday tomorrow there agree like love learning studying feeling working playing living watching getting making ready kinda kind having taking coming looking waiting eating drinking sleeping feeling".split(" "));

    const DEFAULT_SUGGESTIONS = [
      { text: "Can you ask me a question?", send: true },
      { text: "Let's talk about something else.", send: true }
    ];

    const QUESTIONS = [
      "What did you do right before you opened this chat?",
      "What is a food you could eat every week?",
      "Who is someone you like talking to?",
      "What is a place in your city you would show a visitor?",
      "What are you looking forward to?",
      "What is something you are good at, even a small thing?"
    ];

    const REACTS = [
      "Thanks, that was clear.",
      "I can picture that.",
      "Good answer.",
      "Nice — you gave a real detail."
    ];

    const PHRASES = [
      [/배고파|배고프/, "I'm hungry."],
      [/목말라/, "I'm thirsty."],
      [/피곤/, "I'm tired."],
      [/졸려/, "I'm sleepy."],
      [/심심/, "I'm bored."],
      [/바빠/, "I'm busy."],
      [/행복|기뻐/, "I'm happy."],
      [/슬퍼|우울/, "I'm sad."],
      [/긴장|걱정/, "I'm nervous."],
      [/안녕/, "Hello. How are you?"],
      [/고마워|감사/, "Thank you."],
      [/미안|죄송/, "I'm sorry."],
      [/화장실/, "Excuse me, where is the restroom?"],
      [/얼마/, "How much is it?"],
      [/도와/, "Can you help me?"],
      [/모르|모르겠/, "I don't know."],
      [/이해.*안|이해가 안/, "I don't understand. Could you say that more simply?"],
      [/다시|천천히/, "Could you say that again, more slowly?"],
      [/취미/, "What are your hobbies?"],
      [/날씨/, "The weather is nice today."],
      [/주말/, "What are you doing this weekend?"],
      [/맛있/, "It's delicious."],
      [/재미있/, "It's fun."]
    ];

    const FIX_RULES = [
      [/\bi(?:'m| am) not agree\b/gi, "I don't agree", "동의하지 않을 때는 I don't agree예요."],
      [/\bi(?:'m| am) agree\b/gi, "I agree", "agree는 be동사와 같이 쓰지 않아요. I agree."],
      [/\bi very like\b/gi, "I really like", "very는 동사를 꾸미지 못해요. I really like ~."],
      [/\bmore better\b/gi, "better", "better에는 more를 붙이지 않아요."],
      [/\bmore easier\b/gi, "easier", "easier에는 more를 붙이지 않아요."],
      [/\bgoed\b/gi, "went", "go의 과거는 went예요."],
      [/\bteached\b/gi, "taught", "teach의 과거는 taught예요."],
      [/\bbuyed\b/gi, "bought", "buy의 과거는 bought예요."],
      [/\beated\b/gi, "ate", "eat의 과거는 ate예요."],
      [/\bchilds\b/gi, "children", "child의 복수형은 children이에요."],
      [/\binformations\b/gi, "information", "information은 복수형으로 쓰지 않아요."],
      [/\badvices\b/gi, "advice", "advice는 보통 복수로 쓰지 않아요."],
      [/\bpeoples\b/gi, "people", "people이 이미 복수예요."],
      [/\bexplain me\b/gi, "explain to me", "explain me 대신 explain to me예요."],
      [/\bdiscuss about\b/gi, "discuss", "discuss 뒤에는 about을 쓰지 않아요."],
      [/\breturn back\b/gi, "return", "return과 back을 같이 쓰지 않아요."],
      [/\bcan you borrow me\b/gi, "Can you lend me", "빌려 달라는 말은 lend예요. borrow는 내가 빌릴 때 써요."],
      [/\bi have (\d{1,3}) years(?: old)?\b/gi, "I am $1 years old", "나이는 I am ~ years old예요."],
      [/\bi am go\b/gi, "I am going", "be동사 뒤에는 -ing가 와요. 습관이면 I go예요."],
      [/\bi goes\b/gi, "I go", "I 뒤에는 goes가 아니라 go예요."],
      [/\b(go|goes) to school yesterday\b/gi, "went to school yesterday", "yesterday가 있으면 과거 went를 써요."],
      [/\balot\b/gi, "a lot", "a lot는 두 단어예요."],
      [/\bdoesnt\b/gi, "doesn't", "doesn't처럼 어포스트로피를 써요."],
      [/\bdont\b/gi, "don't", "don't처럼 어포스트로피를 써요."],
      [/\bcant\b/gi, "can't", "can't처럼 어포스트로피를 써요."],
      [/\bwanna\b/gi, "want to", "연습할 때는 wanna보다 want to가 분명해요."],
      [/\bgonna\b/gi, "going to", "연습할 때는 gonna보다 going to가 분명해요."]
    ];

    const VERB_BASE = {
      likes: "like",
      goes: "go",
      wants: "want",
      needs: "need",
      eats: "eat",
      plays: "play",
      reads: "read",
      has: "have"
    };

    const TOPIC_MATCH = [
      ["cafe", /cafe|café|카페/i],
      ["weekend", /weekend|주말/i],
      ["travel", /\b(travel|trip|vacation)\b|여행/i],
      ["food", /\b(food|cooking|restaurant)\b|음식|요리/i],
      ["hobby", /\b(hobby|hobbies|music|movies?|films?)\b|취미|영화/i],
      ["school", /\b(school|work|job|office)\b|학교|직장|회사/i],
      ["daily", /\b(my day|today)\b|오늘|하루/i],
      ["free", /anything|free talk|아무거나|자유/i]
    ];

    const TOPICS = {
      free: {
        label: "자유 대화",
        en: "Free talk",
        openers() {
          if (state.name) {
            return [
              {
                en: "Welcome back, {name}. I'm glad you're here. What do you feel like talking about?",
                ko: "{name}, 다시 왔구나. 반가워. 오늘은 뭐에 대해 이야기하고 싶어?",
                simple: "Hi, {name}. What do you want to talk about?",
                expect: "free",
                suggestions: [
                  { text: "Let's talk about my day.", send: true },
                  { text: "Ask me some questions.", send: true },
                  { text: "Let's do the café role-play.", send: true }
                ]
              },
              {
                en: "Hi, {name}. No quiz unless you want one. Tell me something small from today.",
                ko: "{name}, 안녕. 퀴즈는 원할 때만 할게. 오늘 있던 작은 일 하나 말해 줘.",
                simple: "Hi, {name}. Tell me about today.",
                expect: "detail",
                suggestions: [
                  { text: "Today I woke up late.", send: true },
                  { text: "Nothing special happened.", send: true },
                  { text: "I want to talk about food.", send: true }
                ]
              }
            ];
          }
          return [
            {
              en: "Hi! I'm Mina. We can talk about anything — your day, food, plans, or a made-up café. What's your name?",
              ko: "안녕! 나는 미나야. 하루, 음식, 계획, 카페 놀이처럼 아무거나 이야기해도 돼. 이름이 뭐야?",
              simple: "Hi. I am Mina. What is your name?",
              expect: "name",
              suggestions: [
                { text: "My name is ", send: false },
                { text: "Hi! How are you?", send: true },
                { text: "Can we just talk?", send: true }
              ]
            },
            {
              en: "Hello. I'm Mina, your conversation partner. You can answer in short English. What should I call you?",
              ko: "안녕. 나는 대화 친구 미나야. 짧은 영어로 대답해도 돼. 뭐라고 부를까?",
              simple: "Hello. What is your name?",
              expect: "name",
              suggestions: [
                { text: "My name is ", send: false },
                { text: "Let's just talk.", send: true },
                { text: "Let's talk about food.", send: true }
              ]
            }
          ];
        }
      },
      daily: {
        label: "오늘 하루",
        en: "My day",
        openers: [
          {
            en: "Let's talk about today. What time did your day start, {name}?",
            ko: "오늘 이야기를 하자. 하루가 몇 시에 시작됐어?",
            simple: "Tell me about today. What time did you wake up?",
            expect: "detail",
            suggestions: [
              { text: "I woke up at 8.", send: true },
              { text: "My day was busy.", send: true },
              { text: "It was a slow day.", send: true }
            ]
          },
          {
            en: "Pick one moment from today and describe it. Where were you?",
            ko: "오늘 순간 하나를 골라 봐. 어디에 있었어?",
            simple: "Tell me one moment from today.",
            expect: "detail",
            suggestions: [

    function choose(key, list) {
      if (!list || !list.length) return null;

    function cloneReply(raw) {
      const suggestions = raw.suggestions || DEFAULT_SUGGESTIONS;
      return {
        en: raw.en,

    function pack(en, ko, extras = {}) {
      return {

    function fill(text) {
      if (!text) return "";
      if (!state.name) return text.replace(/,?\s*\{name\}/g, "").replace(/\s{2,}/g, " ").trim();
      return text.replaceAll("{name}", state.name);
    }

    function titleName(value) {
      return value.split(/\s+/).map((part) => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase()).join(" ");
    }

    function okName(value) {
      return value.split(/\s+/).every((part) => part && !NOT_NAMES.has(part.toLowerCase()));
    }

    function cleanPhrase(value) {
      return value.replace(/[.!?]+$/g, "").replace(/\s+/g, " ").trim();
    }

    function cutClause(value) {
      return cleanPhrase(value.split(/\b(?:and|but|so|because|more than|rather than)\b|[,.]/i)[0] || "");
    }

    function cleanPlace(value) {
      return cleanPhrase((value.split(/\b(?:next|last|this|in|for|with|on|at|and|but|because|tomorrow|yesterday|today)\b/i)[0] || ""));
    }

    function wordCount(text) {
      return text.split(/\s+/).filter(Boolean).length;

    function countWords(text) {
      const english = text.match(/[A-Za-z0-9']+/g);
      if (english) return english.length;
      const korean = text.match(/[가-힣]+/g);
      return korean ? korean.length : 0;
    }

    function mostlyKorean(text) {
      const korean = (text.match(/[가-힣]/g) || []).length;

    function buildCorrection(text) {
      let better = text;
      const tips = [];
      for (const [pattern, replacement, tip] of FIX_RULES) {
        const next = better.replace(pattern, replacement);
        if (next !== better) {
          tips.push(tip);
          better = next;
        }
      }
      const withTo = better.replace(/\b(want|need|hope|plan|decide) (go|eat|see|buy|play|study|visit|make|watch|read)\b/gi, (match, aux, verb) => `${aux} to ${verb}`);
      if (withTo !== better) {
        tips.push('"want go"처럼 쓰지 않아요. want to go처럼 to를 넣어요.');
        better = withTo;
      }
      const withS = better.replace(/\b(he|she|it) (go|like|want|need|play|eat|read)\b/gi, (match, subject, verb) => {
        const base = verb.toLowerCase() === "go" ? "goes" : `${verb.toLowerCase()}s`;
        return `${subject} ${base}`;
      });
      if (withS !== better) {
        tips.push("주어가 he, she, it일 때 현재형 동사에는 -s를 붙여요.");
        better = withS;
      }
      const withBase = better.replace(/\b(doesn't|does not|don't|do not) (likes|goes|wants|needs|eats|plays|reads|has)\b/gi, (match, aux, verb) => `${aux} ${VERB_BASE[verb.toLowerCase()]}`);
      if (withBase !== better) {
        tips.push("don't나 doesn't 뒤에는 동사원형을 써요.");
        better = withBase;
      }
      if (/\bi\b/.test(better)) {
        better = better.replace(/\bi\b/g, "I");
        tips.push("영어에서 I는 항상 대문자예요.");
      }
      if (better && /[a-z]/.test(better[0])) better = better[0].toUpperCase() + better.slice(1);
      const unique = [...new Set(tips)].slice(0, 2);
      if (!unique.length || better === text) return null;
      return { better, tips: unique };
    }

        return pack("All set, then. Want to keep chatting while you wait?", "그럼 주문은 여기까지요. 기다리는 동안 이야기할까요?", {
          suggestions: [
            { text: "Yes. How is your day?", send: true },
            { text: "No thanks. That's all.", send: true }
          ]
        });
      }
      const item = text.match(/\b(latte|americano|cappuccino|coffee|tea|green tea|cake|cookie|muffin|sandwich|water|juice|hot chocolate)\b/i);
      if (item || /\bi(?:'d| would) like\b|\bi'll (?:take|have)\b|\bcan i (?:get|have)\b/i.test(text)) {
        const name = item ? item[1].toLowerCase() : "";
        const label = name === "water" ? "A glass of water" : name ? name.charAt(0).toUpperCase() + name.slice(1) : "That";
        return pack(`${label}, got it. For here or to go?`, `${label === "That" ? "그거" : label}, 알겠어요. 매장에서 드실까요, 가져가실까요?`, {
          suggestions: [
            { text: "For here, please.", send: true },
            { text: "To go, please.", send: true }
          ]
        });
      }
      return null;
    }

    function replyStory(original, text) {
      let match = text.match(/\b(breakfast|lunch|dinner|snack)\b/i);
      if (match && !/\b(don't|do not)\b/i.test(text)) {
        const meal = match[1].toLowerCase();
        return pack(`${meal.charAt(0).toUpperCase() + meal.slice(1)} says a lot about a day. What do you usually have, and would you eat it again?`, `${meal}만 봐도 하루가 보여. 보통 뭘 먹고, 또 먹을 만해?`, {
          suggestions: [
            { text: `I usually have rice and soup for ${meal}.`, send: true },
            { text: "I skip it sometimes.", send: true }
          ]
        });
      }
      match = text.match(/\b(?:go to|visit|went to|travel to|been to)\s+([a-z][^!.?]{1,40})/i);
      if (match) {
        const place = titleName(cleanPlace(match[1]));
        if (place) {
          const past = /\b(went|been|visited)\b/i.test(text);
          state.lastSubject = place;
          return pack(
            past ? `${place} stayed in your story. What do you still remember?` : `${place} is a vivid choice. What is the first thing you want to do there?`,
            past ? `${place} 이야기가 남았네. 아직 기억나는 건 뭐야?` : `${place} 가고 싶구나. 거기 가서 제일 먼저 뭘 하고 싶어?`,
            {
              suggestions: [
                { text: past ? `I remember the food in ${place}.` : `I want to walk around ${place}.`, send: true },
                { text: "I want to try the local food.", send: true }
              ]
            }
          );
        }
      }
      if (/\b(homework|exam|test|presentation|project|meeting)\b/i.test(text)) {
        return pack("That's a real deadline. When is it, and how ready do you feel?", "기한이 있는 일이구나. 언제고, 준비는 얼마나 된 것 같아?", {
          suggestions: [
            { text: "It's tomorrow, and I'm nervous.", send: true },
            { text: "I feel ready.", send: true },
            { text: "I haven't started.", send: true }
          ]
        });
      }
      if (/\b(this weekend|on the weekend|next weekend)\b/i.test(text)) {
        return pack("Weekends get away fast. What is one plan, even a small one?", "주말은 금방 가. 작은 계획이어도 하나만 말해 줘.", {
          suggestions: [
            { text: "I might meet a friend.", send: true },
            { text: "I want to rest.", send: true }
          ]
        });
      }
      if (/\b(movie|film|drama|series|netflix)\b/i.test(text)) {
        return pack("What are you watching these days, and would you recommend it?", "요즘 뭘 보고 있어? 나한테도 추천할 만해?", {
          suggestions: [
            { text: "I'm watching a short series.", send: true },
            { text: "I don't watch much.", send: true }
          ]
        });
      }
      if (/\b(music|song|playlist)\b/i.test(text) && !/^do you\b/i.test(text)) {
        return pack("Music is an easy conversation. What do you play when you want to feel better?", "음악은 이야기하기 쉽지. 기분이 좋아지고 싶을 때 뭘 틀어?", {
          suggestions: [
            { text: "I play quiet songs.", send: true },
            { text: "I like loud music.", send: true }
          ]
        });
      }
      match = text.match(/\bmy (friend|mom|dad|mother|father|sister|brother|family|parents|girlfriend|boyfriend|partner)\b/i);
      if (match) {
        return pack(`Tell me one true thing about your ${match[1]}. What are they like?`, `네 ${match[1]}에 대해 사실 하나만 말해 줘. 어떤 사람이야?`);
      }
      if (/\b(it's|it is) (really |so |very )?(sunny|rainy|raining|snowing|cold|hot|windy|cloudy)\b/i.test(text) || /\b(sunny|rainy|snowing|windy) today\b/i.test(text)) {
        return pack("Weather changes the shape of a day. Are you going outside?", "날씨가 하루 모양을 바꾸지. 밖에 나갈 거야?", {
          suggestions: [
            { text: "I'll stay inside.", send: true },
            { text: "I might go for a walk.", send: true }
          ]
        });
      }
      if (/\b(coffee|latte|tea)\b/i.test(text)) {
        if (/\bprefer tea\b|\btea person\b/i.test(text)) {
          return pack("Tea it is. Do you drink it hot, or iced?", "차구나. 뜨겁게 마셔, 차갑게 마셔?");
        }
        if (/\bcoffee person\b/i.test(text)) {
          return pack("Coffee it is. Is that a morning cup, or an all-day habit?", "커피구나. 아침에만 마셔, 아니면 하루 종일?");
        }
        return pack("A warm drink makes a conversation easier. Are you a coffee person or a tea person?", "따뜻한 음료가 있으면 대화가 쉬워져. 커피파야, 차파야?", {
          suggestions: [
            { text: "I'm a coffee person.", send: true },
            { text: "I prefer tea.", send: true }
          ]
        });
      }
      if (/\bwoke up\b|\bgot up\b|\bslept late\b/i.test(text)) {
        return pack("That's when the day opened. What did you do next?", "하루가 그때 시작됐구나. 그다음엔 뭘 했어?");
      }
      if (/\b(slow day|long day|normal day)\b/i.test(text)) {
        return pack("Those days still have one scene worth telling. What was the quietest moment?", "그런 하루에도 말할 장면은 하나 있어. 가장 조용했던 순간은 언제야?");
      }
      if (/\bhaven't eaten\b|\bhave not eaten\b|\bnot eaten yet\b/i.test(text)) {
        return pack("Then you're still deciding. What sounds good right now?", "아직 고르는 중이구나. 지금 뭐가 먹고 싶어?");
      }
      if (/\bno plan\b/i.test(text)) {
        return pack("No plan can be a relief. If one small thing appears, what do you hope it is?", "계획 없는 것도 숨 돌리기야. 작은 일 하나가 생긴다면 뭐였으면 좋겠어?");
      }
      if (/\bsleep in\b/i.test(text)) {
        return pack("Sleeping in is a real plan. What time do you hope to wake up?", "늦잠도 계획이야. 몇 시에 깨고 싶어?");
      }
      if (/\bi skip\b/i.test(text)) {
        return pack("Skipping is information too. Is that a habit, or just today?", "거르는 것도 정보야. 습관이야, 아니면 오늘만 그래?");
      }
      if (/\bi play\b/i.test(text) && !/\b(song|songs|music)\b/i.test(text)) {
        return pack("Playing counts. What do you play, and do you do it alone or with someone?", "그것도 취미야. 뭘 하고, 혼자 해 아니면 같이 해?");
      }
      if (/\bdon't have a hobby\b|\bdo not have a hobby\b/i.test(text)) {
        return pack("That's okay. What do you do in a free half hour, even if nobody calls it a hobby?", "그래도 괜찮아. 자유 시간 삼십 분에 뭘 해? 취미가 아니어도 돼.");
      }
      if (/\bmeal\b/i.test(text)) {
        return pack("A good meal can rescue a day. What was on the plate?", "맛있는 한 끼가 하루를 살리기도 해. 접시에 뭐가 있었어?");
      }
      if (/^something spicy[.!]*$/i.test(text)) {
        return pack("Spicy is a whole mood. How hot do you like it — mild, medium, or very hot?", "매운 게 오늘의 기분이구나. 약간, 중간, 아주 매운 것 중에 어디야?");
      }
      if (/\brather not say\b|\bdon't want to say\b/i.test(text)) {
        return pack("That's completely fine. We'll leave it out. What do you feel like talking about?", "안 말해도 전혀 괜찮아. 그건 넘어가자. 무슨 이야기가 하고 싶어?");
      }
      if (/\bfeel ready\b|\bi(?:'m| am) ready\b/i.test(text)) {
        return pack("That's a good place to stand. What did you do to get ready?", "준비된 느낌이 좋네. 뭘 해서 그렇게 됐어?");
      }
      if (/\bhaven't started\b|\bhave not started\b/i.test(text)) {
        return pack("Starting is the hard step. What is the first tiny piece?", "시작이 가장 어렵지. 가장 작은 첫 조각은 뭐야?");
      }
      if (/\bmeet a friend\b|\bsaw a friend\b|\bsee a friend\b/i.test(text)) {
        return pack("Friends make a day easier to describe. What did you do together, or what will you do?", "친구가 있으면 하루를 말하기 쉬워. 같이 뭘 했어, 아니면 뭘 할 거야?");
      }
      if (/\b(day was busy|been busy)\b/i.test(text)) {
        return pack("Busy days pile up. What are you in the middle of?", "바쁜 날은 쌓이지. 지금 무엇 하는 중이야?");
      }
      if (/\bit(?:'s| is) (quiet|busy|crowded|nice|loud)\b/i.test(text)) {
        return pack("That's a useful picture. What do people do there?", "장소가 그려져. 거기 사람들은 뭘 해?");
      }
      return null;
    }

    function replyBecause(original, text) {
      if (!/\bbecause\b/i.test(text)) return null;
      return pack("That's a clear reason. Can you give one example?", "이유가 분명하네. 예를 하나만 들어 줄래?", {
        suggestions: [{ text: "For example, last week I felt the same way.", send: true }]
      });
    }

    function replySmallTalk(original, text) {
      if (!/\b(nothing special|not much|same as usual|i don't know|idk|no idea)\b/i.test(text)) return null;
      return choose("idk", [
        pack("That's allowed. Pick an easy lane: food, a person, or a place.", "그래도 괜찮아. 음식, 사람, 장소 중에 쉬운 걸 골라 봐.", {
          suggestions: [
            { text: "Let's talk about food.", send: true },
            { text: "I saw a friend today.", send: true }
          ]
        }),
        pack('Then borrow my sentence and change the ending: "Today I feel ____."', '그럼 이 문장을 빌려서 끝만 바꿔 봐. "Today I feel ____."', {
          suggestions: [
            { text: "Today I feel tired but okay.", send: true },
            { text: "Today I feel curious.", send: true }
          ]
        })
      ]);
    }

    function replyFallback(original, text) {
      const bit = text.length > 90 ? `${text.slice(0, 87)}…` : text;
      const pool = [
        pack(`I follow you. You said, "${bit}" Can you add one detail — when, where, or who?`, "이해했어. 언제, 어디서, 누구인지 하나만 더 말해 줄래?"),
        pack("That's worth talking about. What happened next?", "이야기할 만하다. 그다음엔 무슨 일이 있었어?"),
        pack("Thanks for sharing that. How did you feel?", "말해 줘서 고마워. 기분은 어땠어?"),
        pack("I'm curious. Why does that matter to you?", "궁금해. 그게 너에게 왜 중요해?")
      ];
      if (state.topic !== "free" && state.turns % 2 === 0) {
        const follow = {
          daily: pack("Bring me back to today. What is one thing you still have to do?", "다시 오늘로 와 보자. 아직 해야 하는 일 하나만 뭐야?"),
          food: pack("Stay with food for a second. Sweet, salty, or spicy — which mood is yours?", "음식에 조금만 더 머물자. 단맛, 짠맛, 매운맛 중에 오늘 기분은 뭐야?"),
          hobby: pack("What hobby would you try for one hour if it cost nothing?", "돈이 안 든다면 한 시간 해보고 싶은 취미는 뭐야?"),
          travel: pack("If you left tomorrow with one small bag, where would you go?", "내일 작은 가방 하나로 떠난다면 어디로 가?"),
          weekend: pack("Who, if anyone, is part of your weekend?", "주말에 같이 있는 사람이 있어?"),
          school: pack("What is the hardest part of school or work this week?", "이번 주 학교나 일에서 가장 힘든 부분은 뭐야?"),
          cafe: pack("We can stay in the café scene. Hot drink, or something sweet?", "카페 상황을 이어가도 좋아요. 따뜻한 음료와 디저트 중에 뭐가 좋아요?", {
            suggestions: [
              { text: "A hot latte, please.", send: true },
              { text: "Something sweet.", send: true },
              { text: "Let's just talk.", send: true }
            ]
          })
        };
        if (follow[state.topic]) return follow[state.topic];
      }
      return choose("fallback", pool);
    }

    function buildReply(original, text) {
      const steps = [
        replyLaughter,
        replyPardon,
        replyGoodbye,
        replyThanks,
        replyHowToSay,
        replyCorrectRequest,
        replyTopicSwitch,
        replySomethingElse,
        replyJustTalk,
        replyStartQuiz,
        replyRepeatQuiz,
        replyQuizStep,
        replyKorean,
        replyToBot,
        replyPersonal,
        replyGreeting,
        replyMeet,
        replyYesNo,
        replyFeeling,
        replyCafe,
        replyStory,
        replyBecause,
        replySmallTalk
      ];
      for (const step of steps) {
        const hit = step(original, text);
        if (hit) return hit;
      }
      return replyFallback(original, text);
    }

    function pickOpener(id) {
      const topic = TOPICS[id] || TOPICS.free;
      const list = typeof topic.openers === "function" ? topic.openers() : topic.openers;
      return cloneReply(choose(`open-${id}`, list));
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function scrollLog() {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      log.scrollTo({ top: log.scrollHeight, behavior: reduce ? "auto" : "smooth" });
    }

    function renderStats() {
      statsEl.textContent = `말한 단어 ${state.words} · ${state.turns}번`;
    }

    function renderSuggestions(items) {
      suggest.replaceChildren();
      (items || []).forEach((item) => {
        const button = el("button", "chip", item.text);
        button.type = "button";
        button.addEventListener("click", () => {
          if (item.send === false) {
            input.value = item.text;
            autosize();
            input.focus();
            return;
          }
          if (state.busy) return;
          input.value = "";
          autosize();
          handleUser(item.text);
        });
        suggest.appendChild(button);
      });
    }

    function addUser(text, correction) {
      const row = el("div", "row user");
      const stack = el("div", "stack");
      stack.appendChild(el("div", "bubble", null)).appendChild(el("p", null, text));
      const bubble = stack.querySelector(".bubble");
      bubble.replaceChildren(el("p", null, text));
      if (correction) {
        const card = el("div", "fix");
        card.appendChild(el("div", "fix-title", "더 자연스럽게"));
        card.appendChild(el("p", "better", correction.better));
        correction.tips.forEach((tip) => card.appendChild(el("p", "tip", tip)));
        stack.appendChild(card);
      }
      row.appendChild(stack);
      log.appendChild(row);
    }

    function addBot(raw) {
      const reply = cloneReply(raw);
      reply.en = fill(reply.en);
      reply.ko = fill(reply.ko);
      reply.simple = fill(reply.simple || reply.en);
      reply.suggestions = reply.suggestions.map((item) => ({ ...item, text: fill(item.text) }));
      state.lastEn = reply.en;
      state.lastSimple = reply.simple;
      state.lastSuggestions = reply.suggestions;
      state.expect = reply.expect || "free";
      state.history.push({ role: "assistant", content: reply.en });
      if (state.history.length > 20) state.history.splice(0, state.history.length - 20);

      const row = el("div", "row bot");
      const avatar = el("div", "avatar", "M");
      avatar.setAttribute("aria-hidden", "true");
      const stack = el("div", "stack");
      const bubble = el("div", "bubble");
      bubble.appendChild(el("p", null, reply.en));
      if (reply.simple && reply.simple !== reply.en) bubble.appendChild(el("p", "simple", reply.simple));
      if (reply.ko) bubble.appendChild(el("p", "hint", reply.ko));
      const speakBtn = el("button", "speak", "▶");
      speakBtn.type = "button";
      speakBtn.setAttribute("aria-label", "영어로 다시 듣기");
      speakBtn.addEventListener("click", () => speak(reply.en, 0.92));
      bubble.appendChild(speakBtn);
      stack.appendChild(bubble);
      row.append(avatar, stack);
      log.appendChild(row);
      renderSuggestions(reply.suggestions);
      scrollLog();
      if (state.voice) speak(reply.en, state.slow ? 0.78 : undefined);
      state.slow = false;
    }

    function showPending() {
      const row = el("div", "row bot pending");
      const avatar = el("div", "avatar", "M");
      avatar.setAttribute("aria-hidden", "true");
      const bubble = el("div", "bubble");
      bubble.appendChild(el("p", null, "생각 중…"));
      row.append(avatar, bubble);
      log.appendChild(row);
      scrollLog();
      return row;
    }

    function rememberName(text) {
      let match = text.match(/\bmy name is\s+([a-z][a-z'-]{1,20}(?:\s+[a-z][a-z'-]{1,20})?)/i);
      if (!match) match = text.match(/\b(?:the name is|i'm called|call me)\s+([a-z][a-z'-]{1,20}(?:\s+[a-z][a-z'-]{1,20})?)/i);
      if (!match) match = text.match(/\b(?:i'm|i am)\s+([a-z][a-z'-]{1,20}(?:\s+[a-z][a-z'-]{1,20})?)[.!,]*$/i);
      if (match && okName(match[1])) state.name = titleName(match[1]);
    }

    async function askMina() {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: state.history.slice(-16),
          topic: state.topic,
          level: state.level,
          name: state.name
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.en) throw new Error(data.error || "응답을 받지 못했어요.");
      const suggestions = (data.suggestions || [])
        .map((item) => String(item).trim())
        .filter(Boolean)
        .slice(0, 3)
        .map((item) => ({ text: item, send: true }));
      return pack(data.en, data.ko || "", {
        simple: data.simple || "",
        suggestions: suggestions.length ? suggestions : DEFAULT_SUGGESTIONS
      });
    }

    async function handleUser(raw) {
      const text = raw.trim().replace(/\s+/g, " ");
      if (!text || state.busy) return;
      state.busy = true;
      input.disabled = true;
      const correction = buildCorrection(text);
      const usable = correction ? correction.better : text;
      addUser(text, correction);
      rememberName(usable);
      state.history.push({ role: "user", content: text });
      state.turns += 1;
      state.words += countWords(text);
      renderStats();
      const pending = showPending();
      let rawReply;
      try {
        if (!state.api) throw new Error("local");
        rawReply = await askMina();
        status.textContent = state.provider === "openrouter" ? "OpenRouter에 연결됨" : "연결됨";
      } catch (error) {
        if (state.api && error.message !== "local") status.textContent = error.message;
        rawReply = buildReply(text, usable);
      } finally {
        pending.remove();
      }
      const reply = cloneReply(rawReply);
      if (!/^bye\b/i.test(reply.en) && state.turns === 5) reply.en += " Five turns already — you are doing real practice.";
      if (!/^bye\b/i.test(reply.en) && state.turns === 10) reply.en += " Ten turns. If you want, tell me a longer story.";
      addBot(reply);
      save();
      state.busy = false;
      input.disabled = false;
      autosize();
      input.focus();
    }

    function markTopic() {
      document.querySelectorAll("[data-topic]").forEach((button) => {
        const active = button.dataset.topic === state.topic;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
        if (active) button.scrollIntoView({ inline: "nearest", block: "nearest" });
      });
    }

    function renderTopics() {
      topicList.replaceChildren();
      Object.keys(TOPICS).forEach((id) => {
        const topic = TOPICS[id];
        const button = el("button", "topic");
        button.type = "button";
        button.dataset.topic = id;
        button.append(el("span", null, topic.label), el("small", null, topic.en));
        button.addEventListener("click", () => {
          state.topic = id;
          state.quiz = false;
          markTopic();
          addBot(pickOpener(id));
          save();
        });
        topicList.appendChild(button);
      });
      markTopic();
    }

    function syncControls() {
      hintsEl.checked = state.hints;
      voiceEl.checked = state.voice;
      log.classList.toggle("beginner", state.level === "beginner");
      log.classList.toggle("hide-hints", !state.hints);
      document.querySelectorAll("[data-level]").forEach((button) => {
        button.classList.toggle("active", button.dataset.level === state.level);
      });
      markTopic();
      renderStats();
    }

    function save() {
      const data = {
        level: state.level,
        topic: state.topic,
        hints: state.hints,
        voice: state.voice,
        name: state.name,
        from: state.from,
        likes: state.likes
      };
      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (error) { /* ignore */ }
    }

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(KEY) || "null");
        if (!data) return;
        if (data.level === "beginner" || data.level === "intermediate") state.level = data.level;
        if (TOPICS[data.topic]) state.topic = data.topic;
        if (typeof data.hints === "boolean") state.hints = data.hints;
        if (typeof data.voice === "boolean") state.voice = data.voice;
        if (typeof data.name === "string") state.name = data.name;
        if (typeof data.from === "string") state.from = data.from;
        if (Array.isArray(data.likes)) state.likes = data.likes.slice(0, 6);
      } catch (error) { /* ignore */ }
    }

    function pickVoice() {
      const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      return voices.find((voice) => /en-US/i.test(voice.lang) && /aria|jenny|samantha|google/i.test(voice.name))
        || voices.find((voice) => /en-US|en_GB/i.test(voice.lang))
        || null;
    }

    function speak(text, rate) {
      if (!window.speechSynthesis || !text) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = rate || (state.level === "beginner" ? 0.92 : 1);
      const voice = pickVoice();
      if (voice) utterance.voice = voice;
      speechSynthesis.speak(utterance);
    }

    function setupSpeech() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) {
        mic.disabled = true;
        mic.title = "이 브라우저는 음성 인식을 지원하지 않아요. Chrome을 써 보세요.";
        return;
      }
      recognition = new Speech();
      recognition.lang = "en-US";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.onresult = (event) => {
        let said = "";
        let interim = false;
        for (let i = 0; i < event.results.length; i += 1) {
          const result = event.results[i];
          said += result[0].transcript;
          if (!result.isFinal) interim = true;
        }
        input.value = said;
        autosize();
        if (!interim && said.trim() && !state.busy) {
          input.value = "";
          autosize();
          handleUser(said.trim());
        }
      };
      recognition.onend = () => {
        listening = false;
        mic.classList.remove("on");
        mic.setAttribute("aria-pressed", "false");
      };
      recognition.onerror = () => {
        listening = false;
        mic.classList.remove("on");
        mic.setAttribute("aria-pressed", "false");
        status.textContent = "마이크를 쓸 수 없어요. 영어로 직접 입력해 주세요.";
      };
      if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 120)}px`;
      send.disabled = !input.value.trim();
    }

    function resetConversation() {
      state.name = "";
      state.from = "";
      state.likes = [];
      state.quiz = false;
      state.quizAt = 0;
      state.turns = 0;
      state.words = 0;
      state.used = {};
      state.topic = "free";
      state.lastEn = "";
      state.lastSimple = "";
      state.lastSuggestions = [];
      state.lastSubject = "";
      state.history = [];
      state.busy = false;
      log.replaceChildren();
      status.textContent = "";
      save();
      syncControls();
      addBot(pickOpener("free"));
      input.focus();
    }

    function bindEvents() {
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (state.busy) return;
        const value = input.value;
        input.value = "";
        autosize();
        handleUser(value);
      });
      input.addEventListener("input", autosize);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });
      document.querySelectorAll("[data-level]").forEach((button) => {
        button.addEventListener("click", () => {
          state.level = button.dataset.level;
          syncControls();
          save();
        });
      });
      hintsEl.addEventListener("change", () => {
        state.hints = hintsEl.checked;
        log.classList.toggle("hide-hints", !state.hints);
        save();
      });
      voiceEl.addEventListener("change", () => {
        state.voice = voiceEl.checked;
        if (!state.voice && window.speechSynthesis) speechSynthesis.cancel();
        save();
      });
      mic.addEventListener("click", () => {
        if (!recognition) {
          status.textContent = "이 브라우저는 음성 인식을 지원하지 않아요. Chrome에서 열어 보세요.";
          return;
        }
        if (listening) {
          recognition.stop();
          return;
        }
        try {
          recognition.start();
          listening = true;
          mic.classList.add("on");
          mic.setAttribute("aria-pressed", "true");
          status.textContent = "듣는 중… 영어로 말해 보세요.";
        } catch (error) {
          status.textContent = "마이크를 시작하지 못했어요.";
        }
      });
      resetBtn.addEventListener("click", () => {
        if (!resetArmed) {
          resetArmed = true;
          resetBtn.textContent = "한 번 더 누르면 지워집니다";
          setTimeout(() => {
            resetArmed = false;
            resetBtn.textContent = "대화 다시 시작";
          }, 2500);
          return;
        }
        resetArmed = false;
        resetBtn.textContent = "대화 다시 시작";
        resetConversation();
      });
    }

    async function connectApi() {
      try {
        const response = await fetch("/api/health");
        const data = await response.json();
        state.api = !!data.ok;
        state.provider = data.provider || "";
        status.textContent = data.ok
          ? (data.provider === "openrouter" ? "OpenRouter에 연결됨" : "연결됨")
          : (data.error || "API 키를 찾지 못했어요.");
      } catch (error) {
        state.api = false;
        if (location.protocol === "file:") {
          status.textContent = "키를 쓰려면 터미널에서 node server.js 를 실행한 뒤 http://127.0.0.1:8787 로 여세요.";
        }
      }
    }

    load();
    renderTopics();
    syncControls();
    setupSpeech();
    bindEvents();
    addBot(pickOpener(state.topic));
    connectApi();
    input.focus();
  </script>
</body>
</html>
